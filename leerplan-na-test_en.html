<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Plan · French the AI Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf7f2;
    --ink: #1a1a2e;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-pale: #fdf6e3;
    --blue-fr: #003189;
    --red-fr: #c0392b;
    --muted: #7a7a8a;
    --card: #ffffff;
    --border: #e8e4dc;
    --correct: #2e7d52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }
  nav {
    background: var(--blue-fr);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  nav a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    transition: color 0.2s;
  }
  nav a:hover { color: #fff; }
  nav .sep { color: rgba(255,255,255,0.3); }
  nav .site-title {
    color: #fff;
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
  }

  .hero {
    background: linear-gradient(135deg, var(--blue-fr) 0%, #001a5c 100%);
    color: white;
    padding: 3rem 1.5rem 2.5rem;
    text-align: center;
  }
  .hero-flag { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }
  .hero h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  .hero p {
    color: rgba(255,255,255,0.75);
    font-size: 0.9rem;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.6;
  }

  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }

  /* LOCKED */
  .locked-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2.5rem;
    text-align: center;
  }
  .locked-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
  .locked-card h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.3rem;
    margin-bottom: 0.75rem;
  }
  .locked-card p { font-size: 0.85rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem; }
  .btn-go {
    display: inline-block;
    background: var(--blue-fr);
    color: white;
    text-decoration: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    transition: background 0.2s;
  }
  .btn-go:hover { background: #001a5c; }

  /* SCORE BANNER */
  .score-banner {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .score-badge {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-weight: 700;
    border: 3px solid;
    flex-shrink: 0;
  }
  .score-badge.high { border-color: var(--correct); color: var(--correct); background: #e8f5ee; }
  .score-badge.mid  { border-color: var(--gold); color: var(--gold); background: var(--gold-pale); }
  .score-badge.low  { border-color: var(--red-fr); color: var(--red-fr); background: #fdecea; }
  .score-info { flex: 1; }
  .score-info h3 { font-family: 'Fraunces', serif; font-size: 1rem; margin-bottom: 0.2rem; }
  .score-info p { font-size: 0.78rem; color: var(--muted); }
  .score-date { font-size: 0.72rem; color: var(--muted); }

  /* PLAN INTRO */
  .plan-intro {
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
  }

  /* TOPIC CARD */
  .topic-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 1rem;
  }
  .topic-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .topic-header:hover { background: var(--cream); }
  .topic-icon { font-size: 1.1rem; flex-shrink: 0; }
  .topic-name {
    flex: 1;
    font-family: 'Fraunces', serif;
    font-size: 1rem;
  }
  .topic-status {
    font-size: 0.72rem;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    font-weight: 500;
  }
  .topic-status.fout { background: #fdecea; color: var(--red-fr); border: 1px solid #f5c6c2; }
  .topic-status.goed { background: #e8f5ee; color: var(--correct); border: 1px solid #b8dcca; }
  .topic-chevron {
    color: var(--muted);
    font-size: 0.8rem;
    transition: transform 0.25s;
  }
  .topic-card.open .topic-chevron { transform: rotate(90deg); }
  .topic-body {
    display: none;
    padding: 0 1.25rem 1.25rem;
    border-top: 1px solid var(--border);
  }
  .topic-card.open .topic-body { display: block; }

  .topic-uitleg {
    font-size: 0.83rem;
    line-height: 1.65;
    color: var(--ink);
    margin-bottom: 1rem;
    padding-top: 0.9rem;
  }
  .topic-uitleg strong { color: var(--blue-fr); }

  .prompt-label {
    font-size: 0.72rem;
    color: var(--gold);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 0.4rem;
  }
  .prompt-box {
    background: var(--gold-pale);
    border: 1px solid var(--gold-light);
    border-radius: 8px;
    padding: 0.9rem;
    font-size: 0.78rem;
    line-height: 1.65;
    white-space: pre-wrap;
    color: var(--ink);
    margin-bottom: 0.6rem;
  }
  .btn-copy-small {
    background: var(--gold);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    padding: 0.45rem 0.9rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-copy-small:hover { background: var(--gold-light); }
  .btn-copy-small.copied { background: var(--correct); color: white; }

  /* ALLE GOED */
  .all-good {
    background: #e8f5ee;
    border: 1px solid #b8dcca;
    border-radius: 12px;
    padding: 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .all-good .ag-icon { font-size: 3rem; display: block; margin-bottom: 0.75rem; }
  .all-good h2 { font-family: 'Fraunces', serif; font-size: 1.3rem; color: var(--correct); margin-bottom: 0.5rem; }
  .all-good p { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }

  /* ACTIONS */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-top: 2rem;
  }
  .btn-action {
    display: block;
    width: 100%;
    padding: 0.85rem;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-action.primary { background: var(--blue-fr); color: white; }
  .btn-action.primary:hover { background: #001a5c; }
  .btn-action.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-action.secondary:hover { border-color: var(--ink); color: var(--ink); }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="site-title">French the AI Way</a>
  <span class="sep">›</span>
  <a href="#">Learning Plan</a>
</nav>

<div class="hero">
  <span class="hero-flag">📋</span>
  <h1>Your Learning Plan</h1>
  <p>Based on your test results — for each topic an explanation and a prompt to practice directly with Claude.</p>
</div>

<main id="main-content">
  <!-- Dynamisch gevuld door JS -->
</main>

<script>
const topicInfo = {
  "Subjonctif": {
    icon: "🔮",
    uitleg: `The <strong>subjonctif</strong> is a verb form used after certain expressions of will, doubt, emotion, or necessity.\n\nFormation: stem of the ils-form + -e, -es, -e, -ions, -iez, -ent.\nExamples: que je parle, que tu finisses, qu'il soit (irregular).\n\nUse it after: vouloir que, il faut que, bien que, pour que, à moins que.`,
    prompt: `I am learning French at B2 level and struggle with the subjonctif. Can you help me with:\n1. A clear explanation of when to use the subjonctif (the 5 most important triggers)\n2. The formation explained step by step\n3. Five practice sentences where I have to choose the correct verb form (indicatif or subjonctif)\n4. The answers afterwards\n\nEnd with a tip for remembering the subjonctif.`
  },
  "Après avoir/être": {
    icon: "⏱️",
    uitleg: `<strong>Après avoir/être</strong> + past participle is used to indicate that one action was fully completed before another began.\n\nWith avoir verbs: après avoir + participle (après avoir mangé)\nWith être verbs: après être + participle (après être parti(e))\n\nNote: the subject of both clauses must be the same!`,
    prompt: `I am practising French at B2 level and make mistakes with 'après avoir/être + infinitif passé'. Help me with:\n1. Explanation of the difference between avoir and être verbs in this construction\n2. Five incorrect sentences that I need to correct\n3. A table with the most common être verbs\n4. Three creative practice sentences to complete\n\nThen give the answers with explanation.`
  },
  "Passief": {
    icon: "🔄",
    uitleg: `The <strong>passive sentence</strong> in French: être + past participle + par + agent.\n\nThe participle agrees with the subject (number and gender).\nActive: Le chef prépare le repas.\nPassive: Le repas est préparé par le chef.\n\nIn all tenses: était préparé (imparfait), a été préparé (passé composé), sera préparé (futur).`,
    prompt: `I am learning French at B2 level and want to better understand the passive sentence. Can you:\n1. Explain the basic structure\n2. Give examples in 4 different tenses (présent, imparfait, passé composé, futur)\n3. Give me 5 active sentences that I need to convert to passive\n4. Explain when the French use the passive vs. the impersonal 'on'\n\nGive the answers after the exercises.`
  },
  "Dont": {
    icon: "🔗",
    uitleg: `<strong>Dont</strong> is a relative pronoun that replaces 'de + something'.\n\nUse dont when the verb or expression requires 'de':\n- avoir besoin de → C'est le livre dont j'ai besoin\n- parler de → La personne dont je parlais\n- être fier de → C'est un résultat dont je suis fier\n\nCompare: qui (subject), que (object), où (place/time), dont (de + something).`,
    prompt: `I am learning French at B2 level and confuse dont with que and qui. Help me with:\n1. An overview of the 4 relative pronouns (qui, que, dont, où) with usage rules\n2. Five sentences where I need to choose the correct pronoun\n3. Explanation of verbs that always require 'de' (and thus use dont)\n4. Two sentences where I need to add a relative clause with dont\n\nGive the answers afterwards.`
  },
  "Imparfait vs. Passé Composé": {
    icon: "⏳",
    uitleg: `<strong>Imparfait</strong> is used for:\n- Habits in the past (je lisais souvent)\n- Descriptions (il faisait beau)\n- Background in a story\n\n<strong>Passé composé</strong> is used for:\n- Completed actions (j'ai lu ce livre)\n- Sequential actions\n- Actions that interrupt the background`,
    prompt: `I am practising French and make mistakes with the difference between imparfait and passé composé. Can you:\n1. Explain the rule of thumb in three short points\n2. Give signal words that indicate each of them\n3. Give a short text (8 sentences) in English that I need to translate into French, where I have to choose the verb tense myself\n4. Then give the model answer with explanation\n\nKeep it practical and B2-appropriate.`
  },
  "Bien que": {
    icon: "↔️",
    uitleg: `<strong>Bien que</strong> means 'although/even though' and always requires the subjonctif.\n\nBien qu'il soit fatigué, il travaille. (not: est)\n\nOther concessive conjunctions with subjonctif:\n- quoique (although)\n- à moins que (unless)\n- pour que (so that)\n- avant que (before)`,
    prompt: `I am learning French at B2 level. I keep forgetting that 'bien que' requires the subjonctif. Help me with:\n1. A list of the 6 most commonly used conjunctions + subjonctif\n2. A memory trick to remember them\n3. Five sentences where the verb form is missing — I need to fill in whether it is subjonctif or indicatif\n4. Two sentences where I need to incorporate 'bien que' myself\n\nGive the answers afterwards.`
  },
  "Si-zinnen": {
    icon: "🔀",
    uitleg: `<strong>Si clauses (hypothetical past)</strong>:\nSi + plus-que-parfait → conditionnel passé\n\nSi j'avais su → je serais venu.\n\nThe three types:\n- Possible: Si tu viens → je t'accompagne (présent + présent/futur)\n- Unlikely: Si tu venais → je t'accompagnerais (imparfait + conditionnel)\n- Impossible past: Si tu étais venu → je t'aurais accompagné (PQP + cond. passé)\n\nNever: si + conditionnel!`,
    prompt: `I am learning French at B2 level and make mistakes with si clauses, especially the hypothetical past variant. Can you:\n1. Give a clear overview of the three types of si clauses (possible, unlikely, impossible)\n2. Explain why you never use conditionnel after 'si'\n3. Give five incomplete si clauses that I need to complete with the correct verb form\n4. Describe two realistic situations (e.g. 'you missed a train') that I need to write in French as a si clause\n\nGive the answers afterwards.`
  },
  "Gérondif": {
    icon: "🔧",
    uitleg: `The <strong>gérondif</strong> = en + present participle (présent participe).\n\nFormation: nous-stem + -ant.\nnous parlons → parlant → en parlant\nnous finissons → finissant → en finissant\n\nUsage: simultaneous action, manner, condition.\nIl a appris le français en écoutant des podcasts.\nElle téléphone en conduisant.`,
    prompt: `I am learning French at B2 level and want to use the gérondif better. Help me with:\n1. The formation step by step (including irregular forms: être, avoir, savoir)\n2. The three usage contexts with examples\n3. The difference between the gérondif and the participle as an adjective\n4. Five sentences where I need to form a gérondif from the given verb\n5. A free writing exercise: describe your morning routine in 4 sentences with at least 2 gérondifs`
  },
  "Nominalisering": {
    icon: "📝",
    uitleg: `<strong>Nominalisation</strong> = converting a verb or clause into a noun.\n\ndécider → la décision\npartir → le départ\narriver → l'arrivée\n\nStructure: possessive pronoun + noun + de + infinitive\nSa décision de partir / Son désir d'apprendre\n\nB2 tip: nominalisation makes your writing style more formal and varied.`,
    prompt: `I am practising French at B2 level and want to use nominalisation more often and more correctly in formal writing. Can you:\n1. Give a list of 10 commonly used verbs with their nominalisations\n2. Five sentences with a verb construction that I need to convert to nominalisation\n3. Explain when nominalisation is typically used (style, context)\n4. Give a paragraph from a newspaper or letter where I need to underline 3 nominalisations\n\nGive the answers afterwards.`
  },
  "Au cas où": {
    icon: "⚠️",
    uitleg: `<strong>Au cas où</strong> = in case of, should it be the case that.\n\nUsage: au cas où + conditionnel (not indicatif!)\nAu cas où il pleuvrait, prenez un parapluie.\nAu cas où tu aurais besoin d'aide, appelle-moi.\n\nDifference with 'si':\n- Si = ordinary condition (+ indicatif)\n- Au cas où = precautionary, more uncertain (+ conditionnel)`,
    prompt: `I am learning French at B2 level and want to learn to use 'au cas où' correctly. Help me with:\n1. Explaining the difference between 'si' and 'au cas où' in two sentences\n2. Give five situations (in English) that I need to convert into a sentence with 'au cas où' + conditionnel\n3. Name three common mistakes with 'au cas où' and explain why they are wrong\n4. Write a short dialogue in which 'au cas où' appears at least twice, that I can then use as a model`
  }
};

function formatDatum(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function renderLeerplan() {
  const raw = localStorage.getItem('fransTestResults');
  const main = document.getElementById('main-content');

  if (!raw) {
    main.innerHTML = `
      <div class="locked-card">
        <span class="locked-icon">🔒</span>
        <h2>No test results yet</h2>
        <p>Take the level test first to generate a personal learning plan. Your results will be saved automatically.</p>
        <a href="franstest-b1-b2.html" class="btn-go">→ Go to the level test</a>
      </div>`;
    return;
  }

  const data = JSON.parse(raw);
  const { score, totaal, wrongTopics, results, datum } = data;
  const allTopics = (results || []).map(r => r.topic);

  // Score banner
  let scoreClass = score >= 8 ? 'high' : score >= 5 ? 'mid' : 'low';
  let scoreLabel = score >= 8 ? 'Excellent!' : score >= 5 ? 'Good progress' : 'Needs work';
  let html = `
    <div class="score-banner">
      <div class="score-badge ${scoreClass}">${score}/${totaal}</div>
      <div class="score-info">
        <h3>${scoreLabel}</h3>
        <p>${wrongTopics.length === 0 ? 'All topics correct!' : `${wrongTopics.length} topic${wrongTopics.length > 1 ? 's' : ''} to work on`}</p>
      </div>
      <span class="score-date">${formatDatum(datum)}</span>
    </div>`;

  if (wrongTopics.length === 0) {
    html += `
      <div class="all-good">
        <span class="ag-icon">🏆</span>
        <h2>All correct!</h2>
        <p>You answered all B2 topics correctly. Use the prompts below to deepen your knowledge further, or move on to C1.</p>
      </div>`;
  } else {
    html += `<p class="plan-intro">Below you will find, for each incorrectly answered topic, an explanation and a ready-made prompt to practise directly with Claude. Click on a topic to expand it.</p>`;
  }

  // Toon eerst foute onderwerpen, dan goede
  const sortedTopics = [
    ...(wrongTopics || []),
    ...(allTopics.filter(t => !wrongTopics.includes(t)))
  ];

  sortedTopics.forEach((topic, idx) => {
    const info = topicInfo[topic];
    if (!info) return;
    const isWrong = wrongTopics.includes(topic);
    html += `
      <div class="topic-card" id="card-${idx}">
        <div class="topic-header" onclick="toggleCard('card-${idx}')">
          <span class="topic-icon">${info.icon}</span>
          <span class="topic-name">${topic}</span>
          <span class="topic-status ${isWrong ? 'fout' : 'goed'}">${isWrong ? 'to practice' : 'correct'}</span>
          <span class="topic-chevron">›</span>
        </div>
        <div class="topic-body">
          <div class="topic-uitleg">${info.uitleg.replace(/\n/g, '<br>')}</div>
          <button class="btn-copy-small" style="background:transparent;color:var(--gold);border:1px solid var(--gold-light);" onclick="toggleTopicPrompt(this, '${idx}')">Show prompt ▾</button>
          <div class="prompt-body-${idx}" style="display:none;margin-top:0.75rem;">
            <div class="prompt-label">Claude prompt</div>
            <div class="prompt-box">${info.prompt}</div>
            <button class="btn-copy-small" onclick="copyTopicPrompt(this, '${idx}')">Copy prompt</button>
          </div>
        </div>
      </div>`;
  });

  html += `
    <div class="actions">
      <a href="dagelijks-oefenen.html" class="btn-action primary">🗓 Start daily practice</a>
      <a href="hertest.html" class="btn-action primary" style="background:var(--correct)">🔁 Take the retest</a>
      <a href="franstest-b1-b2.html" class="btn-action secondary">↩ Retake the test</a>
    </div>`;

  main.innerHTML = html;

  // Auto-open eerste foute kaart
  if (wrongTopics.length > 0) {
    const firstCard = document.getElementById('card-0');
    if (firstCard) firstCard.classList.add('open');
  }
}

function toggleCard(id) {
  const card = document.getElementById(id);
  card.classList.toggle('open');
}

const promptTexts = Object.values(topicInfo).map(i => i.prompt);

function copyTopicPrompt(btn, idx) {
  const sortedTopics = getSortedTopics();
  const topic = sortedTopics[parseInt(idx)];
  const info = topicInfo[topic];
  if (!info) return;

  navigator.clipboard.writeText(info.prompt).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy prompt';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function toggleTopicPrompt(btn, idx) {
  const body = document.querySelector(`.prompt-body-${idx}`);
  const open = body.style.display === 'none';
  body.style.display = open ? 'block' : 'none';
  btn.textContent = open ? 'Hide prompt ▴' : 'Show prompt ▾';
}

function getSortedTopics() {
  const raw = localStorage.getItem('fransTestResults');
  if (!raw) return [];
  const data = JSON.parse(raw);
  const { wrongTopics, results } = data;
  const allTopics = (results || []).map(r => r.topic);
  return [
    ...(wrongTopics || []),
    ...(allTopics.filter(t => !wrongTopics.includes(t)))
  ];
}

renderLeerplan();
</script>
</body>
</html>
